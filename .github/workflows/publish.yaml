# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ master, element1-backports ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@27c2fc841818cce349e1f424af51cca9ea381f47
    with:
      write-comments: false
      sdk: dev
    permissions:
      id-token: write
      pull-requests: write
