# A CI configuration to auto-publish pub packages.
#
# Pushing a tag PACKAGE-vVERSION publishes the package in directory PACKAGE.
# Publish checks on pull requests run in the Health workflow.

name: Publish
permissions:
  contents: read

on:
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  package:
    if: ${{ github.repository_owner == 'dart-lang' }}
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.directory.outputs.directory }}
    steps:
      - id: directory
        name: Find the package directory from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          directory="${TAG%-v*}"
          if [[ ! "$directory" =~ ^[a-z_]+$ ]]; then
            echo "No package directory in tag $TAG."
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

  publish:
    needs: package
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a2a85876fe519099fd3f528670216b240f975906
    with:
      working-directory: ${{ needs.package.outputs.directory }}
