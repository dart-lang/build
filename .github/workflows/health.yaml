name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@27c2fc841818cce349e1f424af51cca9ea381f47
    with:
      checks: "version,changelog,do-not-submit"
      ignore_license: "**.g.dart"
      sdk: dev
    permissions:
      pull-requests: write
