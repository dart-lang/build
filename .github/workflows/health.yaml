name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@16dca7ae5d3ff896a4db47e1ed6cd50f7ebbf115
    with:
      checks: "version,changelog,do-not-submit"
      ignore_license: "**.g.dart"
      sdk: dev
    permissions:
      pull-requests: write
