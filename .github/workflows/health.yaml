name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master, element1-backports ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@0bfa654e652c27987d614c54675ff32becf5b574
    with:
      checks: "changelog,do-not-submit,publish"
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      ignore_license: "**.g.dart"
      sdk: dev
    permissions:
      pull-requests: write
