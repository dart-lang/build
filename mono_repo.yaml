# See https://github.com/google/mono_repo.dart for details on this file
self_validate: analyze_and_format

merge_stages:
- analyze_and_format

github:
  permissions:
    contents: read
  on_completion:
    # Job that runs always and fails if any prior job failed to provide that
    # information with a stable job name.
    - name: ci
      runs-on: ubuntu-latest
      if: always()
      steps:
        - name: Fail if any job failed or was cancelled
          if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          run: exit 1
