# See https://github.com/google/mono_repo.dart for details on this file
self_validate: analyze_and_format

merge_stages:
- analyze_and_format

github:
  permissions:
    contents: read
  on_completion:
    - name: ci
      runs-on: ubuntu-latest
      # Runs whatever happened above, because a job that simply depends on a
      # failed job is skipped rather than failed, and a skipped check counts
      # as a passing one.
      if: always()
      steps:
        - name: Fail if any job failed or was cancelled
          if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          run: exit 1
